name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  build-test:
    # On a brand-new repo this waits for the lockfile workflow, which re-runs CI afterwards.
    needs: lockfile
    if: needs.lockfile.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Surface failures as annotations so they show on the run and on pull requests
            grep -E "not ok|Error|expected|actual|failureType|location:" test.log | head -60 | while IFS= read -r l; do echo "::error title=Test failure::$l"; done
            exit 1
          fi
      - run: npm run build
      - name: Dependency audit (production deps, high+)
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            npm audit --omit=dev --json > audit.json || true
            jq -r '.vulnerabilities | to_entries[] | select(.value.severity=="high" or .value.severity=="critical") | "::error title=npm audit::\(.key) (\(.value.severity)) range \(.value.range) via \([.value.via[] | if type=="object" then .title else . end] | join("; ")) fix: \(.value.fixAvailable | if type=="object" then "\(.name)@\(.version)" else tostring end)"' audit.json
            exit 1
          fi

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bicep lint + check azuredeploy.json is up to date
        run: |
          az bicep install
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --outfile /tmp/azuredeploy.json
          # Compare ignoring the generator metadata block
          jq 'del(.metadata)' /tmp/azuredeploy.json > /tmp/a.json
          jq 'del(.metadata)' infra/azuredeploy.json > /tmp/b.json
          if ! diff -q /tmp/a.json /tmp/b.json; then
            echo "::error::infra/azuredeploy.json is stale. Run: az bicep build -f infra/main.bicep --outfile infra/azuredeploy.json"
            exit 1
          fi
