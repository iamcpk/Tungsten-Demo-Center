name: Publish container images

# Builds the three images that the Deploy to Azure template pulls from GHCR.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'docker/**', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: if [ -f package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  image:
    # The Dockerfiles use npm ci, which needs the lockfile.
    needs: lockfile
    if: needs.lockfile.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin, encoder]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
